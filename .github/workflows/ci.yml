name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Build and run automated tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DOTNET_ROOT = Split-Path -Parent (Get-Command dotnet).Source
          dotnet restore CodexQuotaBar.sln
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build CodexQuotaBar.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet test tests/CodexQuotaBar.Tests -c Release --no-build --no-restore --logger 'console;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }

